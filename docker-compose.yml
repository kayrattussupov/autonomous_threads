services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    restart: unless-stopped

  worker:
    build: .
    command: sh -c "python -m alembic upgrade head && python -m src.scheduler"
    env_file: .env
    depends_on:
      - postgres
    restart: unless-stopped

  api:
    build: .
    command: sh -c "python -m alembic upgrade head && uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    env_file: .env
    depends_on:
      - postgres
    expose:
      - "8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
