queue_depth: 5
feed_view_daily_cap: 200
max_post_age_days: 3
reply_triage_lookback_days: 30
metrics_refresh_window_days: 90
budget:
  soft_stop_usd: 8.0
  hard_stop_usd: 10.0
  soft_stop_allowed_role: post_writer
agent_limits:
  max_steps: 8
  max_tokens: 40000
  max_seconds: 120
search_groups:
  - name: automation_smb
    keywords:
      - "автоматизация бизнеса"
      - "n8n"
      - "ИИ агент для бизнеса"
      - "внедрение ИИ в бизнес"
      - "AI агент для бизнеса"
      - "автоматизировать процессы"
      - "нужна автоматизация"
      - "whatsapp"
      - "ищу ИИ специалиста"
ab_test_models: false
publish_times:
  - "09:00"
  - "14:00"
  - "20:00"
publish_timezone: "Asia/Almaty"
post_length:
  min_chars: 200
  max_chars: 400
  hard_max_chars: 500
search:
  provider: tavily
  max_results: 5
topic_planner:
  seed_sectors:
    - производство
    - розничная торговля
    - логистика и доставка
    - клиники и медицина
    - HoReCa
    - недвижимость
    - услуги и сервис
    - онлайн-школы
    - строительство
    - e-commerce
  category_mix:
    utp_cta: 0.5
    educational: 0.3
    personal: 0.1
    news: 0.1
  window_posts: 12
  max_sector_share: 0.5
  prior_strength: 3
  new_sector_prob: 0.1
